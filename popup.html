<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataMimi</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/32.png" width="22" height="22" alt="" />
      <strong>DataMimi</strong>
      <span id="account" class="account"></span>
      <label class="lang" title="Language">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" /></svg>
        <select id="lang" aria-label="Language"></select>
      </label>
    </header>

    <form id="make" class="make">
      <label for="job" id="makeTitle" class="make-title"></label>
      <div class="make-row">
        <textarea id="job" rows="3" maxlength="2000"></textarea>
        <button id="go" type="submit"></button>
      </div>
    </form>

    <nav id="tabs" class="tabs" role="tablist"></nav>

    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
      <input id="q" type="search" autocomplete="off" />
    </label>
    <nav id="kinds" class="kinds" role="tablist"></nav>
    <ul id="list"></ul>
    <div id="none" class="none" hidden></div>
    <footer>
      <a id="all" target="_blank" rel="noreferrer"></a>
      <span id="free"></span>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
